# XcodeGen spec for OfflineTodos.xcodeproj. The project file is committed, so XcodeGen is only
# needed after changing this file: run `xcodegen` in this folder.
name: OfflineTodos
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  OfflineFirstFramework:
    path: ../..
targets:
  OfflineTodos:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [OfflineTodos]
    dependencies:
      - package: OfflineFirstFramework
        product: OfflineFirstFramework
    info:
      path: OfflineTodos/Info.plist
      properties:
        CFBundleDisplayName: Offline To-dos
        BGTaskSchedulerPermittedIdentifiers: [io.github.muhittincamdali.OfflineTodos.sync]
        UIBackgroundModes: [fetch]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Lets the demo reach Examples/SyncServer on http://localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulator needs no signing.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
schemes:
  OfflineTodos:
    build:
      targets:
        OfflineTodos: all
    run:
      config: Debug
